      path: /apis/cdi.kubevirt.io/v1beta1/namespaces/{namespace}/datasources/{name}
      operations:
      - name: readnamespaceddatasource
        method: GET
        description: KubeVirt Get a DataSource
        outputRawFormat: json
        outputParameters:
        - name: result
